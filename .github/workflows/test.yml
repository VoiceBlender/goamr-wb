name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # amd64 exercises the AVX2 kernels, arm64 the portable scalar path.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install reference codec libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencore-amrwb0 libvo-amrwbenc0

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Bit-exact differential tests vs opencore-amrwb / vo-amrwbenc
        run: make diff

      - name: Bit-exact differential tests, portable kernels (purego)
        run: GOFLAGS=-tags=purego make diff
